<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in to Waypoint Logistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="waypoint/login/resources/css/style.css">
</head>
<body class="login-pf">
<div class="login-pf-page">
    <div id="kc-header" class="login-pf-page-header">
        <div id="kc-header-wrapper">Sign in to Waypoint Logistics</div>
    </div>
    <div class="card-pf">
        <header class="login-pf-header">
            <h1 id="kc-page-title">Welcome back</h1>
        </header>
        <div id="kc-content">
            <div id="kc-content-wrapper">
                <form id="kc-form-login" class="form" action="#" method="post" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label for="username" class="control-label">Work email</label>
                        <input id="username" class="form-control" name="username" type="text" placeholder="name@synapx.lk" autofocus />
                    </div>

                    <div class="form-group">
                        <label for="password" class="control-label">Password</label>
                        <input id="password" class="form-control" name="password" type="password" placeholder="Enter your password" />
                    </div>

                    <div id="kc-form-options">
                        <div class="checkbox">
                            <label><input id="rememberMe" name="rememberMe" type="checkbox"> Remember this device</label>
                        </div>
                        <a id="kc-forgot-password" href="#">Forgot password?</a>
                    </div>

                    <div id="kc-form-buttons">
                        <input id="kc-login" class="btn btn-primary" type="submit" value="Sign in to Dispatcher" />
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
