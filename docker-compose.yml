services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waypoint_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_UNPOOLED=${DATABASE_URL_UNPOOLED:-}
      - KEYCLOAK_URL=${KEYCLOAK_URL:-https://auth.tenderease.me}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-waypointlogistics}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-waypoint-backend}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-your_keycloak_client_secret_here}
      - KEYCLOAK_ALGORITHM=${KEYCLOAK_ALGORITHM:-RS256}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-account}
      - KEYCLOAK_DEV_MODE=${KEYCLOAK_DEV_MODE:-true}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-super-secret-key-32chars}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      - DISPATCHER_DEFAULT_DEPOT=${DISPATCHER_DEFAULT_DEPOT:-peliyagoda}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_APP_ENV: ${ENVIRONMENT:-development}
        NEXT_PUBLIC_APP_NAME: "Waypoint Logistics"
        NEXT_PUBLIC_KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.tenderease.me}
        NEXT_PUBLIC_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-waypointlogistics}
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-waypoint-frontend}
        NEXT_PUBLIC_STORE_DATA_SOURCE: ${NEXT_PUBLIC_STORE_DATA_SOURCE:-api}
        NEXT_PUBLIC_STORE_OUTLET_ID: ${NEXT_PUBLIC_STORE_OUTLET_ID:-1}
    container_name: waypoint_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      - NEXT_PUBLIC_APP_ENV=${ENVIRONMENT:-development}
      - NEXT_PUBLIC_KEYCLOAK_URL=${KEYCLOAK_URL:-https://auth.tenderease.me}
      - NEXT_PUBLIC_KEYCLOAK_REALM=${KEYCLOAK_REALM:-waypointlogistics}
      - NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=${KEYCLOAK_FRONTEND_CLIENT_ID:-waypoint-frontend}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional local PostgreSQL profile: only starts if you run 'docker compose --profile local-db up'
  database:
    profiles: ["local-db"]
    image: postgres:16-alpine
    container_name: waypoint_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-waypoint_logistics}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-waypoint_logistics}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
